<!DOCTYPE html>
<html lang="pa">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Punjab - Social App</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            -webkit-tap-highlight-color: transparent;
        }
        body {
            background-color: #000;
            color: #fff;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }
        .phone-frame {
            width: 100%;
            max-width: 400px;
            height: 100vh;
            max-height: 850px;
            background: url('watermarked_img_13770963300162300816.png') no-repeat center center;
            background-size: cover;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            align-items: center;
            padding: 40px 20px;
            position: relative;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
        }
        .phone-frame::before {
            content: '';
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0, 0, 0, 0.4);
            z-index: 1;
        }
        .logo-container, .login-box {
            position: relative;
            z-index: 2;
            width: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        .logo-container {
            margin-top: 40px;
        }
        .logo-img {
            width: 110px;
            height: 110px;
            border-radius: 50%;
            object-fit: cover;
            border: 3px solid #fff;
            box-shadow: 0 4px 10px rgba(0,0,0,0.3);
            /* ਲੋਗੋ ਨੂੰ ਬਿਲਕੁਲ ਸਿੱਧਾ ਕਰਨ ਲਈ */
            transform: rotate(0deg); 
        }
        .login-box {
            background: rgba(20, 20, 20, 0.85);
            padding: 25px 20px;
            border-radius: 16px;
            width: 100%;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.5);
            backdrop-filter: blur(10px);
            margin-bottom: 20px;
        }
        .input-field {
            width: 100%;
            padding: 12px 15px;
            margin-bottom: 12px;
            background: rgba(255, 255, 255, 0.1);
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 8px;
            color: #fff;
            font-size: 14px;
            outline: none;
        }
        .input-field::placeholder {
            color: #bbb;
        }
        .login-btn {
            width: 100%;
            padding: 12px;
            background: #0095f6;
            border: none;
            border-radius: 8px;
            color: #fff;
            font-weight: bold;
            font-size: 15px;
            cursor: pointer;
            transition: background 0.2s;
        }
        .login-btn:hover {
            background: #1877f2;
        }
    </style>
</head>
<body>

    <div class="phone-frame">
        <!-- ਸਿੱਧੇ ਲੋਗੋ ਵਾਲਾ ਹਿੱਸਾ -->
        <div class="logo-container">
            <img src="watermarked_img_13770963300162300816.png" alt="Punjab Logo" class="logo-img">
        </div>

        <!-- ਯੂਜ਼ਰ ਆਈਡੀ ਅਤੇ ਪਾਸਵਰਡ ਲੌਗਇਨ ਫਾਰਮ -->
        <div class="login-box">
            <input type="text" class="input-field" placeholder="ਯੂਜ਼ਰ ਆਈਡੀ (User ID)" required>
            <input type="password" class="input-field" placeholder="ਪਾਸਵਰਡ (Password)" required>
            <button class="login-btn">ਲੌਗਇਨ ਕਰੋ</button>
        </div>
    </div>

</body>
</html>
