<!DOCTYPE html>
<html lang="pa">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Instagram - Punjab</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            -webkit-tap-highlight-color: transparent;
        }
        body {
            background-color: #fafafa;
            color: #262626;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }
        .phone-frame {
            width: 100%;
            max-width: 380px;
            height: 100vh;
            max-height: 800px;
            background: #fff;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            align-items: center;
            padding: 20px;
            border: 1px solid #dbdbdb;
            position: relative;
        }
        .insta-header {
            width: 100%;
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 16px;
            font-weight: 600;
            padding-bottom: 10px;
            border-bottom: 1px solid #efefef;
        }
        .content-area {
            width: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            flex-grow: 1;
            gap: 20px;
        }
        .logo-img {
            width: 90px;
            height: 90px;
            border-radius: 50%;
            object-fit: cover;
            border: 2px solid #e1306c;
            padding: 2px;
        }
        .login-box {
            width: 100%;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }
        .input-field {
            width: 100%;
            padding: 12px;
            background: #fafafa;
            border: 1px solid #dbdbdb;
            border-radius: 6px;
            font-size: 14px;
            outline: none;
        }
        .input-field:focus {
            border-color: #a8a8a8;
        }
        .login-btn {
            width: 100%;
            padding: 12px;
            background: #0095f6;
            border: none;
            border-radius: 8px;
            color: #fff;
            font-weight: 600;
            font-size: 14px;
            cursor: pointer;
        }
        .login-btn:active {
            opacity: 0.7;
        }
        .insta-footer {
            font-size: 12px;
            color: #8e8e8e;
            margin-top: 10px;
        }
    </style>
</head>
<body>

    <div class="phone-frame">
        <!-- Instagram Top Bar -->
        <div class="insta-header">
            <span><i class="fa-solid fa-lock"></i> user_8065</span>
            <i class="fa-solid fa-bars"></i>
        </div>

        <!-- Center Content / Profile & Login -->
        <div class="content-area">
            <img src="watermarked_img_13770963300162300816.png" alt="Punjab Logo" class="logo-img">
            
            <div class="login-box">
                <input type="text" class="input-field" placeholder="Phone number, username, or email" required>
                <input type="password" class="input-field" placeholder="Password" required>
                <button class="login-btn">Log in</button>
            </div>
        </div>

        <!-- Footer -->
        <div class="insta-footer">
            Instagram from Meta
        </div>
    </div>

</body>
</html>
